<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14211e"/>
      <stop offset="100%" stop-color="#1c2f29"/>
    </linearGradient>
  </defs>

  <!-- Fondo: cuadrado redondeado, safe-zone para maskable icons -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Barras ascendentes: representan crecimiento / proyección -->
  <g>
    <rect x="146" y="288" width="58" height="118" rx="14" fill="#618073"/>
    <rect x="227" y="230" width="58" height="176" rx="14" fill="#76a98b"/>
    <rect x="308" y="164" width="58" height="242" rx="14" fill="#a9c9b8"/>
  </g>

  <!-- Trazo de tendencia sobre las barras -->
  <path d="M 146 262 L 227 204 L 308 138 L 366 108"
        stroke="#76a98b" stroke-width="12" stroke-linecap="round"
        stroke-linejoin="round" fill="none" opacity="0.9"/>

  <!-- Punto final del trazo -->
  <circle cx="366" cy="108" r="16" fill="#a9c9b8"/>
</svg>
